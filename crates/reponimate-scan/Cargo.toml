[package]
name = "reponimate-scan"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast, safe repository scanner for Reponimate: walks a checkout, filters binaries/secrets/generated files, redacts credentials and emits JSON."

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
